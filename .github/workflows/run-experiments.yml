name: Run experiments

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      build_images:
        description: Build and publish node images before running the experiment
        required: false
        default: "yes"
        type: choice
        options: ["yes", "no"]

permissions:
  contents: read
  issues: write
  packages: write

jobs:
  build-images:
    if: github.event_name == 'schedule' || inputs.build_images != 'no'
    uses: ./.github/workflows/build-images.yml

  run:
    needs: build-images
    # `needs.build-images.result` is skipped when build_images is "no".
    if: always() && (needs.build-images.result == 'success' || needs.build-images.result == 'skipped')
    runs-on: ubuntu-24.04
    env:
      REPOSITORY: ${{ github.repository }}
      REF: ${{ github.sha }}
      EXPERIMENT_REPOSITORY: iftech/10ksim
      EXPERIMENT_WORKFLOW: run-nodes.yml
      EXPERIMENT_CONFIG: experiments/gossipsub-regression.yaml
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Dispatch the experiment
        id: dispatch
        env:
          # Fine-grained token with Actions: write access to iftech/10ksim.
          GH_TOKEN: ${{ secrets.TENKSIM_TOKEN }}
          BUILD_IMAGES_RESULT: ${{ needs.build-images.result }}
        run: |
          set -euo pipefail

          test -n "$GH_TOKEN" || {
            echo "::error::TENKSIM_TOKEN is required to dispatch iftech/10ksim";
            exit 1;
          }

          TAG=""
          if [ "$BUILD_IMAGES_RESULT" = "success" ]; then
            TAG="$REF"
          fi

          DISPATCH_RESPONSE=$(
            jq -n \
              --arg repo "$REPOSITORY" \
              --arg ref "$REF" \
              --arg tag "$TAG" \
              --arg config "$EXPERIMENT_CONFIG" \
              '{
                ref: "master",
                return_run_details: true,
                inputs: {repo: $repo, ref: $ref, tag: $tag, config: $config}
              }' |
              gh api \
                --method POST \
                "repos/$EXPERIMENT_REPOSITORY/actions/workflows/$EXPERIMENT_WORKFLOW/dispatches" \
                --input -
          )

          RUN_ID=$(jq -r '.workflow_run_id // empty' <<< "$DISPATCH_RESPONSE")
          RUN_URL=$(jq -r '.html_url // empty' <<< "$DISPATCH_RESPONSE")
          test -n "$RUN_ID" && test -n "$RUN_URL" || {
            echo "::error::The 10ksim dispatch did not return workflow run details";
            exit 1;
          }

          echo "Dispatched experiment: $RUN_URL"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "run_url=$RUN_URL" >> "$GITHUB_OUTPUT"

      - name: Analyze the experiment outcome
        id: analyze
        env:
          GH_TOKEN: ${{ secrets.TENKSIM_TOKEN }}
          RUN_ID: ${{ steps.dispatch.outputs.run_id }}
          RUN_URL: ${{ steps.dispatch.outputs.run_url }}
        run: |
          set -euo pipefail

          gh run watch "$RUN_ID" \
            --repo "$EXPERIMENT_REPOSITORY" \
            --interval 10 || true

          CONCLUSION=$(
            gh run view "$RUN_ID" \
              --repo "$EXPERIMENT_REPOSITORY" \
              --json conclusion \
              --jq .conclusion
          )

          RESULTS_DIR="$RUNNER_TEMP/10ksim-$RUN_ID"
          ARTIFACT_NAME="run-$RUN_ID"
          ARTIFACT_ID=$(
            gh api "repos/$EXPERIMENT_REPOSITORY/actions/runs/$RUN_ID/artifacts" \
              --jq ".artifacts[] | select(.name == \"$ARTIFACT_NAME\") | .id" |
              head -n 1
          )

          echo "artifact_id=$ARTIFACT_ID" >> "$GITHUB_OUTPUT"

          PROBLEMS=0
          RESULT_ERROR=""
          # 10ksim uploads this artifact only when it reports problems.
          if [ -n "$ARTIFACT_ID" ]; then
            mkdir -p "$RESULTS_DIR"
            if ! gh run download "$RUN_ID" \
                --repo "$EXPERIMENT_REPOSITORY" \
                --name "$ARTIFACT_NAME" \
                --dir "$RESULTS_DIR"; then
              RESULT_ERROR="the results artifact could not be downloaded"
            elif [ -f "$RESULTS_DIR/node_results.json" ]; then
              if ! PROBLEMS=$(jq -er '.problems | numbers' "$RESULTS_DIR/node_results.json"); then
                RESULT_ERROR="node_results.json has no numeric problems field"
              fi
            else
              RESULT_ERROR="the results artifact has no node_results.json"
            fi
          elif [ "$CONCLUSION" != "success" ]; then
            RESULT_ERROR="the results artifact is missing"
          fi

          if [ "$CONCLUSION" = "success" ] && [ "$PROBLEMS" = "0" ] && [ -z "$RESULT_ERROR" ]; then
            echo "Experiment succeeded: $RUN_URL"
            echo "unsuccessful=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          DETAILS="workflow conclusion: $CONCLUSION"
          if [ -n "$RESULT_ERROR" ]; then
            DETAILS="$DETAILS; $RESULT_ERROR"
          elif [ "$PROBLEMS" != "0" ]; then
            DETAILS="$DETAILS; reported problems: $PROBLEMS"
          fi

          echo "Experiment unsuccessful: $DETAILS"
          echo "unsuccessful=true" >> "$GITHUB_OUTPUT"
          echo "details=$DETAILS" >> "$GITHUB_OUTPUT"

      - name: Prepare structured node results
        if: always() && steps.dispatch.outputs.run_id != ''
        env:
          RUN_ID: ${{ steps.dispatch.outputs.run_id }}
        run: |
          RESULTS_DIR="$RUNNER_TEMP/10ksim-$RUN_ID"
          if [ -f "$RESULTS_DIR/node_results.json" ]; then
            python3 tools/summarize_node_errors.py "$RESULTS_DIR" > "$RESULTS_DIR/diagnostics.md"
          fi

      - name: Upload structured node results
        if: always() && steps.dispatch.outputs.run_id != ''
        uses: actions/upload-artifact@v4
        with:
          name: structured-node-results-${{ steps.dispatch.outputs.run_id }}
          path: ${{ runner.temp }}/10ksim-${{ steps.dispatch.outputs.run_id }}/node_results.enriched.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Open an issue for an unsuccessful experiment
        if: always() && (steps.analyze.outputs.unsuccessful == 'true' || (steps.dispatch.outcome == 'success' && steps.analyze.outcome == 'failure'))
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.dispatch.outputs.run_id }}
          RUN_URL: ${{ steps.dispatch.outputs.run_url }}
          DETAILS: ${{ steps.analyze.outputs.details }}
          ARTIFACT_ID: ${{ steps.analyze.outputs.artifact_id }}
        run: |
          set -euo pipefail

          if [ -z "$DETAILS" ]; then
            DETAILS="experiment analysis failed; inspect the workflow logs"
          fi

          ISSUE_BODY=$(printf '%s\n' \
            "The automated experiment had an unsuccessful outcome." \
            "" \
            "- Experiment: \`$EXPERIMENT_CONFIG\`" \
            "- Source: \`$REPOSITORY@$REF\`" \
            "- Result: $DETAILS" \
            "- 10ksim workflow and logs artifact: [$RUN_ID]($RUN_URL)")

          RESULTS_DIR="$RUNNER_TEMP/10ksim-$RUN_ID"
          if [ -n "$ARTIFACT_ID" ]; then
            ISSUE_BODY="$ISSUE_BODY"$'\n'"- [Download full logs artifact]($RUN_URL/artifacts/$ARTIFACT_ID)"
          fi
          if [ -f "$RUNNER_TEMP/10ksim-$RUN_ID/node_results.enriched.json" ]; then
            ISSUE_BODY="$ISSUE_BODY"$'\n'"- [Structured results artifact]($GITHUB_SERVER_URL/$REPOSITORY/actions/runs/$GITHUB_RUN_ID)"
          fi
          if [ -f "$RESULTS_DIR/diagnostics.md" ]; then
            ISSUE_BODY="$ISSUE_BODY"$'\n\n'"$(cat "$RESULTS_DIR/diagnostics.md")"
          elif [ -f "$RESULTS_DIR/summary.md" ]; then
            ISSUE_BODY="$ISSUE_BODY"$'\n\n'"$(cat "$RESULTS_DIR/summary.md")"
          fi

          ISSUE_BODY_FILE="$RUNNER_TEMP/experiment-issue-$RUN_ID.md"
          printf '%s\n' "$ISSUE_BODY" > "$ISSUE_BODY_FILE"
          ISSUE_URL=$(
            gh issue create \
              --repo "$REPOSITORY" \
              --title "Experiment failed: $EXPERIMENT_CONFIG" \
              --body-file "$ISSUE_BODY_FILE" \
              --assignee vladopajic
          )
          echo "Opened issue: $ISSUE_URL"
