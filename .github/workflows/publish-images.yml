name: Publish node images

on:
  push:
    branches: [master]

concurrency:
  group: publish-node-images-master
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: [dummy, bootstrap, gossipsub]

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          build-args: NODE=${{ matrix.node }}
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.node }}:master
            ghcr.io/${{ github.repository }}/${{ matrix.node }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.node }}
          cache-to: type=gha,mode=max,scope=${{ matrix.node }}
