name: Publish node images

on:
  workflow_run:
    workflows: [Test nodes]
    types: [completed]

concurrency:
  group: publish-node-images-main
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: [dummy, bootstrap, gossipsub]

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          build-args: NODE=${{ matrix.node }}
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.node }}:main
            ghcr.io/${{ github.repository }}/${{ matrix.node }}:${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha,scope=${{ matrix.node }}
          cache-to: type=gha,mode=max,scope=${{ matrix.node }}
