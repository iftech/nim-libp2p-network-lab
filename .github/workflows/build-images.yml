name: Build node images

on:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: build-node-images-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  LIBP2P_REPOSITORY: https://github.com/iftech/nim-libp2p.git

jobs:
  resolve-libp2p:
    runs-on: ubuntu-24.04
    outputs:
      revision: ${{ steps.resolve.outputs.revision }}
    steps:
      - name: Resolve nim-libp2p master
        id: resolve
        run: |
          set -euo pipefail
          REVISION=$(git ls-remote "$LIBP2P_REPOSITORY" refs/heads/master | awk '{print $1}')
          [[ "$REVISION" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::Could not resolve a unique nim-libp2p master commit"
            exit 1
          }
          echo "Building nim-libp2p revision $REVISION"
          echo "revision=$REVISION" >> "$GITHUB_OUTPUT"

  build:
    needs: resolve-libp2p
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: [dummy, bootstrap, gossipsub]

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          build-args: |
            NODE=${{ matrix.node }}
            LIBP2P_REPOSITORY=${{ env.LIBP2P_REPOSITORY }}
            LIBP2P_REF=${{ needs.resolve-libp2p.outputs.revision }}
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.node }}:main
            ghcr.io/${{ github.repository }}/${{ matrix.node }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.node }}
          cache-to: type=gha,mode=max,scope=${{ matrix.node }}

      - name: Retain the latest 10 image versions
        uses: actions/delete-package-versions@v5
        with:
          package-name: nim-libp2p-network-lab/${{ matrix.node }}
          package-type: container
          min-versions-to-keep: 10
